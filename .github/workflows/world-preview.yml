name: Build Project C3 world preview 0.19
on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - '.github/workflows/world-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply independent world patch to original project
        run: |
          set -euo pipefail
          unzip -q ProjectC3_Web_v0.9_Source.zip -d source
          project="$PWD/source/ProjectC3_Web_v0.9/Ford3D"
          python3 -m py_compile preview/patch_world.py
          python3 preview/patch_world.py "$project"
          cp preview/smoke_test.gd "$project/world_preview_test.gd"
          node --check preview/menu_019.js
          node --check online/config.js
      - name: Install same Godot version as legacy build
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          godot --version
      - name: Import, parse and test actual Godot scene
        run: |
          set -euo pipefail
          project="$PWD/source/ProjectC3_Web_v0.9/Ford3D"
          godot --headless --path "$project" --editor --import 2>&1 | tee /tmp/c3-world-import.log
          godot --headless --path "$project" --check-only --script res://ford/world.gd 2>&1 | tee /tmp/c3-world-check.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/c3-world-import.log /tmp/c3-world-check.log; then exit 1; fi
          timeout 150 godot --headless --path "$project" --fixed-fps 60 --script res://world_preview_test.gd 2>&1 | tee /tmp/c3-world-test.log
          grep -F 'C3 world preview smoke test passed' /tmp/c3-world-test.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/c3-world-test.log; then exit 1; fi
      - name: Export candidate web build
        run: |
          set -euo pipefail
          project="$PWD/source/ProjectC3_Web_v0.9/Ford3D"
          rm "$project/world_preview_test.gd"
          mkdir -p "$PWD/candidate"
          godot --headless --path "$project" --export-release Web "$PWD/candidate/c3-world-019.html" 2>&1 | tee /tmp/c3-world-export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/c3-world-export.log; then exit 1; fi
          cp candidate/c3-world-019.html candidate/index.html
          cp preview/menu_019.js candidate/c3-menu-019.js
          cp online/config.js candidate/c3-config.js
          for f in index.html c3-world-019.js c3-world-019.wasm c3-world-019.pck c3-menu-019.js c3-config.js; do test -s "candidate/$f"; done
          grep -F 'c3-menu-019.js' candidate/index.html
      - name: Retain tested preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: c3-world-preview-019
          path: candidate/
          retention-days: 7
      - name: Preserve previous deployed site before adding preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never replace the existing game with a partial deployment.
          mkdir -p /tmp/previous site
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-web.yml/runs?status=success&per_page=5" > /tmp/legacy-runs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/world-preview.yml/runs?status=success&per_page=5" > /tmp/preview-runs.json
          run_id="$(python3 - <<'PY'
          import json
          runs=json.load(open('/tmp/legacy-runs.json'))['workflow_runs']+json.load(open('/tmp/preview-runs.json'))['workflow_runs']
          runs.sort(key=lambda r:r['updated_at'],reverse=True)
          print(runs[0]['id'] if runs else '')
          PY
          )"
          if [ -z "$run_id" ]; then echo "No prior successful Pages build; refusing to overwrite the site"; exit 1; fi
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n github-pages -D /tmp/previous
          test -s /tmp/previous/artifact.tar
          tar -xf /tmp/previous/artifact.tar -C site
          test -s site/index.html
          test -s site/alpha/index.html
          mkdir -p site/world-preview
          cp -a candidate/. site/world-preview/
          touch site/.nojekyll
          echo "Original root and alpha retained; preview added separately."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
